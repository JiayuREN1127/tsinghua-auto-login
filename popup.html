<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>清华自动登录</title>
  <style>
    :root { --ts:#7b0f15; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      width:320px; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      font-size:14px; color:#222; background:#fafafa;
    }
    .header {
      background:var(--ts); color:#fff; padding:12px 16px;
      display:flex; align-items:center; gap:10px;
    }
    .header .logo {
      width:30px; height:30px; border-radius:6px; background:rgba(255,255,255,.15);
      display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px;
    }
    .header h1 { font-size:15px; font-weight:600; }
    .header p { font-size:11px; opacity:.85; }
    .body { padding:16px; }
    label { display:block; font-size:12px; color:#555; margin:10px 0 4px; }
    input[type="text"], input[type="password"] {
      width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px;
      font-size:14px; outline:none;
    }
    input:focus { border-color:var(--ts); }
    .btn {
      width:100%; margin-top:14px; padding:9px; border:none; border-radius:6px;
      background:var(--ts); color:#fff; font-size:14px; cursor:pointer;
    }
    .btn:hover { opacity:.9; }
    .btn.secondary { background:#eee; color:#333; margin-top:8px; }
    .status { margin-top:10px; font-size:12px; color:#666; min-height:16px; word-break:break-all; }
    .status.ok { color:#1a9446; }
    .status.err { color:#d33; }
    .switch-row {
      display:flex; align-items:center; justify-content:space-between; margin-top:12px;
    }
    .switch { position:relative; width:42px; height:22px; }
    .switch input { display:none; }
    .slider {
      position:absolute; inset:0; background:#ccc; border-radius:22px; cursor:pointer; transition:.2s;
    }
    .slider::before {
      content:""; position:absolute; width:16px; height:16px; left:3px; top:3px;
      background:#fff; border-radius:50%; transition:.2s;
    }
    .switch input:checked + .slider { background:var(--ts); }
    .switch input:checked + .slider::before { transform:translateX(20px); }
    .hint { font-size:11px; color:#999; margin-top:12px; line-height:1.6; }
    .hint a { color:var(--ts); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">清</div>
    <div>
      <h1>清华自动登录</h1>
      <p>清华大学统一身份认证自动登录</p>
    </div>
  </div>
  <div class="body">
    <label for="username">用户名（学号/工号）</label>
    <input type="text" id="username" autocomplete="username" placeholder="学号、工作证号或账号" />

    <label for="password">密码</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="密码" />

    <div class="switch-row">
      <span>自动登录</span>
      <label class="switch">
        <input type="checkbox" id="autoMode" checked />
        <span class="slider"></span>
      </label>
    </div>

    <button class="btn" id="save">保存并启用</button>
    <button class="btn secondary" id="clear">清除全部记录</button>
    <div class="status" id="status"></div>
    <div class="hint">
      密码仅保存在本机浏览器（chrome.storage.local），不会同步到云端。
      自动登录在访问 id.tsinghua.edu.cn 登录页时触发。
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
